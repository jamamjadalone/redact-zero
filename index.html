<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04060b" />
    <title>RedactZero — Zero-Knowledge Document Redactor</title>
    <meta
      name="description"
      content="Redact IDs, passports and KYC documents entirely in your browser. Solid blackout, pixelation, anti-fraud watermarks and metadata scrubbing. No uploads, no telemetry, works offline."
    />
    <meta name="application-name" content="RedactZero" />
    <meta name="apple-mobile-web-app-title" content="RedactZero" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.json" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RedactZero" />
    <meta property="og:url" content="https://jamamjadalone.is-a.dev/redact-zero/" />
    <meta property="og:title" content="RedactZero — Zero-Knowledge Document Redactor" />
    <meta
      property="og:description"
      content="Redact sensitive IDs and KYC documents 100% in your browser. Nothing is uploaded, nothing is tracked, and it works offline."
    />
    <meta property="og:image" content="https://jamamjadalone.is-a.dev/redact-zero/icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="RedactZero shield logo" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="RedactZero — Zero-Knowledge Document Redactor" />
    <meta
      name="twitter:description"
      content="Redact sensitive IDs and KYC documents 100% in your browser. Nothing is uploaded, nothing is tracked, and it works offline."
    />
    <meta name="twitter:image" content="https://jamamjadalone.is-a.dev/redact-zero/icon-512.png" />
    <meta name="twitter:image:alt" content="RedactZero shield logo" />

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(900px 500px at 50% 0%, rgba(52, 211, 153, 0.08), transparent 65%),
          #04060b;
        color: #e2e8f0;
        font-family: 'Segoe UI Variable Text', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot {
        display: flex;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      #boot .mark {
        display: grid;
        height: 60px;
        width: 60px;
        place-items: center;
        border-radius: 18px;
        background: linear-gradient(145deg, #0f2b26, #06100d);
        border: 1px solid rgba(52, 211, 153, 0.24);
        color: #5eead4;
        box-shadow:
          0 1px 0 rgba(255, 255, 255, 0.08) inset,
          0 0 40px -10px rgba(52, 211, 153, 0.55);
      }
      #boot p {
        margin: 0;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #7c8ca6;
      }
      #boot .bar {
        width: 180px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(148, 163, 184, 0.14);
      }
      #boot .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #34d399, #38bdf8);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot">
        <div class="mark">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="M9 12l2 2 4-4" />
          </svg>
        </div>
        <p>Opening local sandbox</p>
        <div class="bar"></div>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; text-align: center">
        RedactZero runs entirely in your browser and requires JavaScript. Nothing is ever uploaded.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
