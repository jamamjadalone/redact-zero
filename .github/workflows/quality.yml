name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Audit, build and browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run test:repo` runs the repository audit (build, security, SEO,
      # structure, package hygiene). The headless-Chrome smoke test runs below
      # as a separate, non-blocking step because it's environment-sensitive.
      - name: Run repository audit
        run: npm run test:repo

      - name: Run browser smoke test (non-blocking)
        run: npm run test:smoke || true
        continue-on-error: true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
